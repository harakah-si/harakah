name: Release

# Publishes to npm. Nothing runs on its own: a version tag or a manual run starts it, and it needs the NPM_TOKEN secret
# (an npm "automation" or granular token with publish rights) in the repository secrets.
#   git tag v0.3.0 && git push origin v0.3.0                   → harakah-fixer (tag must equal package.json version)
#   git tag remotion-arabic-v0.1.0 && git push origin …       → @harakah/remotion-arabic
#   Actions → Release → Run workflow (dry run on by default)  → everything up to `npm publish --dry-run`
# The tagged commit must have green CI (`test` and `vscode (real editor)`); this job checks that instead of re-running
# the 9-minute suite, then rebuilds and runs the pack smoke test before publishing.

on:
  push:
    tags: ["v*", "remotion-arabic-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [harakah-fixer, "@harakah/remotion-arabic"]
        default: harakah-fixer
      dry_run:
        description: Dry run (npm publish --dry-run, nothing is published)
        type: boolean
        default: true

permissions:
  contents: read
  checks: read     # verify CI passed on the commit being released
  id-token: write  # npm provenance (public repos only)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/remotion/package-lock.json

      - name: Which package and version
        id: pkg
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "push" ]; then
            dry=false
            case "$REF_NAME" in
              remotion-arabic-v*) dir=packages/remotion-arabic; want="${REF_NAME#remotion-arabic-v}" ;;
              v*) dir=.; want="${REF_NAME#v}" ;;
              *) echo "::error::unexpected tag $REF_NAME"; exit 1 ;;
            esac
          else
            dry="$INPUT_DRY_RUN"
            [ "$INPUT_PACKAGE" = "@harakah/remotion-arabic" ] && dir=packages/remotion-arabic || dir=.
            want=""
          fi
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          private=$(node -p "!!require('./$dir/package.json').private")
          if [ -n "$want" ] && [ "$want" != "$version" ]; then
            echo "::error::tag $REF_NAME does not match $name@$version in $dir/package.json"; exit 1
          fi
          if [ "$private" = "true" ] && [ "$dry" != "true" ]; then
            echo "::error::$name is \"private\": true. Remove that line from its package.json to publish it."; exit 1
          fi
          { echo "dir=$dir"; echo "name=$name"; echo "version=$version"; echo "dry=$dry"; echo "private=$private"; } >> "$GITHUB_OUTPUT"
          echo "### $name@$version · dry run: $dry" >> "$GITHUB_STEP_SUMMARY"

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.name == "test" or .name == "vscode (real editor)") | "\(.name)=\(.conclusion)"')
          echo "$runs"
          for c in "test" "vscode (real editor)"; do
            echo "$runs" | grep -qx "$c=success" || { echo "::error::CI check '$c' has not passed on $SHA; release a commit with green CI"; exit 1; }
          done

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix fixtures/remotion   # types for @harakah/remotion-arabic
          npm run build

      - name: Pack smoke test (harakah-fixer)
        if: steps.pkg.outputs.dir == '.'
        run: npm run pack:check

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY: ${{ steps.pkg.outputs.dry }}
          PRIVATE: ${{ steps.pkg.outputs.private }}
          # provenance links the package to this workflow run; npm only supports it for public repositories,
          # and it needs "repository" in package.json to point at this repo: add it back before making the repo public
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          if [ "$DRY" = "true" ] && [ "$PRIVATE" = "true" ]; then
            echo "private package: npm refuses even a dry-run publish, so this is the pack it would upload"
            npm pack --dry-run
            exit 0
          fi
          args=(--access public)
          [ "$DRY" = "true" ] && args+=(--dry-run)
          [ "$PROVENANCE" = "true" ] && args+=(--provenance)
          if [ "$DRY" != "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret is not set"; exit 1; fi
          npm publish "${args[@]}"
