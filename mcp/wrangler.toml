name = "harakah-mcp"
main = "dist/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
no_bundle = true
# Custom domain (DNS record is created by Cloudflare): mcp.harakah.si
routes = [{ pattern = "mcp.harakah.si", custom_domain = true }]

[observability]
enabled = false

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

# Workers Paid: Remotion parsing needs ~300 ms CPU per call (free plan: 10 ms -> error 1102)
[limits]
cpu_ms = 30000
