<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'IBM Plex Sans Arabic';src:url('../assets/fonts/IBMPlexSansArabic-Bold.ttf');font-weight:700}
html,body{margin:0;width:1280px;height:720px;background:#0e0f12;color:#f2efe9}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// a per-letter cascade drawn on canvas: each letter drops in on its own
const ctx = document.getElementById("c").getContext("2d");
const WORD = "الحكايات";
function seek(t) {
  ctx.clearRect(0, 0, 1280, 720);
  ctx.font = "700 140px 'IBM Plex Sans Arabic'"; ctx.fillStyle = "#e3b24c";
  let x = 200;
  [...WORD].forEach((ch, i) => {
    const k = Math.min(1, Math.max(0, t * 2 - i * 0.2));
    ctx.globalAlpha = k; ctx.fillText(ch, x, 400 - (1 - k) * 120);
    x += ctx.measureText(ch).width;
  });
}
window.seek = seek; seek(4);
</script>
</body>
</html>
