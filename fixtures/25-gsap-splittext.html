<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<style>
@font-face{font-family:'Alexandria';src:url('../assets/fonts/Alexandria.ttf');font-weight:100 900}
html,body{margin:0;width:1280px;height:720px;background:#0e0f12;color:#f2efe9}
#root{width:1280px;height:720px;display:flex;align-items:center;justify-content:center;font-family:'Alexandria',sans-serif}
.title{font-size:110px;font-weight:800;margin:0}
</style>
</head>
<body>
<div id="root" dir="rtl" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1280" data-height="720">
  <h1 class="title" id="title">الموسم الجديد</h1>
</div>
<script>
gsap.registerPlugin(SplitText);
const split = SplitText.create("#title", { type: "words,chars" });
const tl = gsap.timeline({ paused: true });
tl.from(split.chars, { y: 80, opacity: 0, stagger: 0.04, duration: 0.6, ease: "power3.out" });
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
