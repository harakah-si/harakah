<script type="module">
import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
const scene = new THREE.Scene();
new FontLoader().load("./fonts/arabic.typeface.json", (font) => {
  const geo = new TextGeometry("قصص تستحق أن تُروى", { font, size: 0.6, height: 0.12, bevelEnabled: true });
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xe3b24c })));
});
</script>
