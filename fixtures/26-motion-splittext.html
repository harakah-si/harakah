<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Alexandria';src:url('../assets/fonts/Alexandria.ttf');font-weight:100 900}
html,body{margin:0;width:1280px;height:720px;background:#0e0f12;color:#f2efe9}
#root{width:1280px;height:720px;display:flex;align-items:center;justify-content:center;font-family:'Alexandria',sans-serif}
.title{font-size:110px;font-weight:800;margin:0}
</style>
</head>
<body>
<div id="root" dir="rtl">
  <h1 class="title" id="title">الموسم الجديد</h1>
</div>
<script type="module">
import { animate, stagger } from "motion";
import { splitText } from "motion-plus";
const { chars } = splitText("#title");
animate(chars, { opacity: [0, 1], y: [40, 0] }, { delay: stagger(0.04), duration: 0.6 });
</script>
</body>
</html>
