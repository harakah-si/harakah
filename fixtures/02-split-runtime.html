<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<style>
@font-face{font-family:'IBM Plex Sans Arabic';src:url('../assets/fonts/IBMPlexSansArabic-Bold.ttf');font-weight:700}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('../assets/fonts/IBMPlexSansArabic-Regular.ttf');font-weight:400}
html,body{margin:0;width:1280px;height:720px;background:#0e0f12;color:#f2efe9;font-family:'IBM Plex Sans Arabic',sans-serif}
.stage{width:1280px;height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.title{font-size:96px;font-weight:700}

</style>
</head>
<body>
<div class="stage" dir="rtl"><h1 class="title" id="title"></h1></div>
<script>
const text = "سلام على أهل غزة والشام";
const el = document.getElementById("title");
[...text].forEach((c) => { const s = document.createElement("span"); s.textContent = c === " " ? "\u00a0" : c; s.style.display = "inline-block"; el.appendChild(s); });
el.querySelectorAll("span").forEach((s, i) => s.animate([{opacity: 0, transform: "translateY(60px)"}, {opacity: 1, transform: "none"}], {duration: 500, delay: i * 45, fill: "both", easing: "cubic-bezier(.2,.8,.2,1)"}));
</script>
</body>
</html>
