# Harakah in GitHub Actions: fail the check when Arabic in your motion graphics would render broken.
# Copy this file to .github/workflows/harakah.yml. Each problem is annotated on its line in the pull request, and the
# job summary lists what blocks the merge with the fix command. Nothing is uploaded: the check runs on the runner.
# Docs: https://www.npmjs.com/package/harakah-fixer (docs/REFERENCE.md, "GitHub Actions")
name: Harakah

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  arabic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Static checks of the folder (HTML/GSAP/HyperFrames files, a Remotion project, Astro/Vue/Svelte templates):
      # seconds, no browser. Exit 1: Arabic would render broken. Exit 2: something couldn't be checked.
      # Pin the version you tested with; --strict also blocks on warnings.
      - name: Arabic gate
        run: npx -y -p harakah-fixer@0.4 harakah-fix gate . --github

      # Optional: also render HTML scenes in Chrome (installed on GitHub's Ubuntu runners) and check the Arabic reading
      # order at sampled frames. Slower. Add --offline to refuse CDN requests while rendering.
      # - name: Arabic gate with layout audit
      #   run: npx -y -p harakah-fixer@0.4 harakah-fix gate . --github --layout

      # Optional: when the gate fails, render before/after evidence for one scene and attach it to the run.
      # - name: Before/after evidence
      #   if: failure()
      #   run: npx -y -p harakah-fixer@0.4 harakah-fix compare path/to/scene.html -o harakah-evidence
